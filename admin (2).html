<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STAMCAR Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0A0A0A; --card: #161616; --card2: #1C1C1C;
      --red: #B1121A; --red2: #D41420;
      --text: #D9D9D9; --dim: #666; --silver: #C8C8C8;
      --border: rgba(255,255,255,0.07); --red-b: rgba(177,18,26,0.3);
      --green: #22c55e; --r: 8px;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: var(--red); border-radius: 3px; }

    /* LOGIN */
    #loginScreen { position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center; }
    .login-box { background:var(--card);border:1px solid var(--red-b);border-radius:16px;padding:3rem 2.5rem;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.7),0 0 40px rgba(177,18,26,0.1); }
    .login-logo { font-family:'Orbitron',sans-serif;font-size:1.8rem;font-weight:900;letter-spacing:.15em;background:linear-gradient(135deg,#fff,#c8c8c8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.35rem; }
    .login-sub { font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:.25em;color:var(--red);text-transform:uppercase;margin-bottom:2.5rem; }
    .login-label { font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:.5rem;text-align:left; }
    .login-input { width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:#fff;padding:.85rem 1rem;font-size:1rem;font-family:'Montserrat',sans-serif;letter-spacing:.1em;outline:none;text-align:center;transition:border-color .2s;margin-bottom:1.25rem; }
    .login-input:focus { border-color:var(--red); }
    .login-btn { width:100%;background:var(--red);color:#fff;border:none;border-radius:8px;padding:.9rem;font-family:'Orbitron',sans-serif;font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:.2s;box-shadow:0 4px 20px rgba(177,18,26,0.4); }
    .login-btn:hover { background:var(--red2);transform:translateY(-1px); }
    .login-error { color:var(--red);font-size:.8rem;margin-top:.85rem;min-height:1.2em;display:none; }
    .login-error.show { display:block;animation:shake .3s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

    #adminContent { display:none; }

    /* HEADER */
    .header { background:rgba(10,10,10,0.95);border-bottom:1px solid var(--red-b);padding:.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px); }
    .header-logo { font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:900;letter-spacing:.15em;background:linear-gradient(135deg,#fff,#c8c8c8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
    .header-sub { font-family:'Orbitron',sans-serif;font-size:.55rem;letter-spacing:.2em;color:var(--red);text-transform:uppercase; }
    .back-link { font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:.1em;color:var(--dim);text-decoration:none;padding:.4rem .8rem;border:1px solid var(--border);border-radius:var(--r);transition:.2s; }
    .back-link:hover { color:var(--text);border-color:var(--dim); }

    /* LAYOUT */
    .layout { display:grid;grid-template-columns:360px 1fr;min-height:calc(100vh - 56px); }

    /* SIDEBAR */
    .sidebar { background:var(--card);border-right:1px solid var(--border);padding:1.5rem;overflow-y:auto;position:sticky;top:56px;height:calc(100vh - 56px); }
    .sidebar-title { font-family:'Orbitron',sans-serif;font-size:.72rem;letter-spacing:.15em;color:var(--red);text-transform:uppercase;margin-bottom:1.5rem;padding-bottom:.75rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem; }
    .form-group { margin-bottom:1rem; }
    .form-group label { display:block;font-family:'Orbitron',sans-serif;font-size:.58rem;letter-spacing:.15em;color:var(--dim);text-transform:uppercase;margin-bottom:.3rem; }
    .form-group label span { color:var(--red); }
    .form-group input, .form-group select, .form-group textarea { width:100%;background:var(--card2);border:1px solid var(--border);border-radius:var(--r);color:var(--text);padding:.6rem .85rem;font-family:'Montserrat',sans-serif;font-size:.85rem;outline:none;transition:border-color .2s;appearance:none;resize:vertical; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--red); }
    .form-group input::placeholder, .form-group textarea::placeholder { color:var(--dim); }
    .form-row { display:grid;grid-template-columns:1fr 1fr;gap:.75rem; }
    .badge-row { display:flex;gap:.5rem; }
    .badge-opt { flex:1;text-align:center;padding:.45rem;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:.72rem;font-weight:600;transition:.2s;user-select:none; }
    .badge-opt[data-val=""] { color:var(--dim); }
    .badge-opt[data-val="hot"] { color:#ef4444; }
    .badge-opt[data-val="new"] { color:var(--green); }
    .badge-opt.selected { border-color:currentColor;background:rgba(255,255,255,0.05); }
    .hints { font-size:.72rem;color:var(--dim);margin-top:.25rem; }
    .btn { display:inline-flex;align-items:center;gap:.4rem;padding:.7rem 1.25rem;border-radius:var(--r);font-family:'Orbitron',sans-serif;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border:none;transition:.2s;width:100%;justify-content:center; }
    .btn-add { background:var(--red);color:#fff;box-shadow:0 4px 20px rgba(177,18,26,0.35); }
    .btn-add:hover { background:var(--red2);transform:translateY(-1px); }
    .btn-add:disabled { opacity:.5;cursor:not-allowed;transform:none; }
    .btn-clear { background:transparent;color:var(--dim);border:1px solid var(--border);margin-top:.5rem; }
    .btn-clear:hover { color:var(--text); }

    /* MAIN */
    .main { padding:1.5rem;overflow-y:auto; }
    .stats-bar { display:flex;gap:.75rem;margin-bottom:1.5rem;flex-wrap:wrap; }
    .stat-pill { background:var(--card);border:1px solid var(--border);border-radius:100px;padding:.45rem 1.1rem;font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.1em;display:flex;align-items:center;gap:.4rem; }
    .stat-pill .num { color:var(--red);font-weight:700;font-size:.85rem; }
    .table-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.75rem; }
    .table-title { font-family:'Orbitron',sans-serif;font-size:.75rem;letter-spacing:.15em;color:var(--text);text-transform:uppercase; }
    .search-input { background:var(--card);border:1px solid var(--border);border-radius:var(--r);color:var(--text);padding:.5rem .9rem;font-family:'Montserrat',sans-serif;font-size:.85rem;outline:none;width:200px;transition:border-color .2s; }
    .search-input:focus { border-color:var(--red); }
    .search-input::placeholder { color:var(--dim); }
    .cars-table { width:100%;border-collapse:collapse; }
    .cars-table thead tr { border-bottom:1px solid var(--border); }
    .cars-table th { font-family:'Orbitron',sans-serif;font-size:.55rem;letter-spacing:.15em;color:var(--dim);text-transform:uppercase;padding:.7rem .6rem;text-align:left;white-space:nowrap; }
    .cars-table tbody tr { border-bottom:1px solid rgba(255,255,255,0.03);transition:background .15s; }
    .cars-table tbody tr:hover { background:rgba(255,255,255,0.02); }
    .cars-table td { padding:.75rem .6rem;font-size:.82rem;vertical-align:middle; }
    .td-make { font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:.1em;color:var(--red);text-transform:uppercase; }
    .td-model { font-weight:600;color:#fff;white-space:nowrap; }
    .td-price { font-family:'Orbitron',sans-serif;font-weight:700;background:linear-gradient(135deg,#fff,var(--silver));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap; }
    .td-dim { color:var(--dim);font-size:.78rem;white-space:nowrap; }
    .badge-tag { display:inline-block;font-family:'Orbitron',sans-serif;font-size:.52rem;letter-spacing:.08em;padding:.18rem .45rem;border-radius:4px;text-transform:uppercase; }
    .badge-tag.hot { background:rgba(177,18,26,0.2);color:var(--red);border:1px solid rgba(177,18,26,0.3); }
    .badge-tag.new { background:rgba(34,197,94,0.15);color:var(--green);border:1px solid rgba(34,197,94,0.3); }
    .badge-tag.none { color:var(--dim);font-size:.7rem; }
    .action-btn { padding:.3rem .55rem;border-radius:5px;font-size:.72rem;cursor:pointer;border:none;transition:.2s;font-family:'Montserrat',sans-serif; }
    .btn-edit { background:rgba(255,255,255,0.06);color:var(--text);margin-right:.25rem; }
    .btn-edit:hover { background:rgba(255,255,255,0.12); }
    .btn-delete { background:rgba(177,18,26,0.15);color:var(--red);border:1px solid rgba(177,18,26,0.2); }
    .btn-delete:hover { background:rgba(177,18,26,0.3); }
    .empty-state { text-align:center;padding:4rem;color:var(--dim);font-size:.9rem; }
    .empty-state svg { display:block;margin:0 auto 1rem;opacity:.3; }
    .db-status { display:inline-flex;align-items:center;gap:.4rem;font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:.1em;padding:.3rem .75rem;border-radius:100px;border:1px solid; }
    .db-status.ok { color:var(--green);border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.08); }
    .db-status.err { color:var(--red);border-color:var(--red-b);background:rgba(177,18,26,0.08); }
    .db-status.loading { color:var(--dim);border-color:var(--border); }

    /* MODAL */
    .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1.5rem; }
    .modal-box { background:var(--card);border:1px solid var(--red-b);border-radius:12px;width:100%;max-width:540px;max-height:88vh;overflow-y:auto;padding:2rem;position:relative; }
    .modal-title { font-family:'Orbitron',sans-serif;font-size:.75rem;letter-spacing:.15em;color:var(--red);text-transform:uppercase;margin-bottom:1.25rem; }
    .modal-close { position:absolute;top:.9rem;right:.9rem;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);width:28px;height:28px;border-radius:50%;font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s; }
    .modal-close:hover { background:var(--red);border-color:var(--red); }

    /* TOAST */
    .toast { position:fixed;bottom:1.5rem;right:1.5rem;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.8rem 1.25rem;font-size:.82rem;z-index:9999;display:flex;align-items:center;gap:.5rem;animation:slideIn .3s ease;box-shadow:0 8px 40px rgba(0,0,0,0.6); }
    .toast.success { border-color:rgba(34,197,94,0.3); }
    .toast.error   { border-color:rgba(177,18,26,0.3); }
    @keyframes slideIn { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

    /* Spinner */
    .spinner { width:18px;height:18px;border:2px solid rgba(255,255,255,0.1);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;display:inline-block; }
    @keyframes spin { to{transform:rotate(360deg)} }

    @media (max-width:800px) {
      .layout { grid-template-columns:1fr; }
      .sidebar { position:static;height:auto; }
      .form-row { grid-template-columns:1fr; }
      .search-input { width:100%; }
      .table-header { flex-direction:column;align-items:flex-start; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">STAMCAR</div>
    <div class="login-sub">Admin Panel</div>
    <div class="login-label">Κωδικός Πρόσβασης</div>
    <input type="password" class="login-input" id="pwInput" placeholder="••••••••••"
      onkeydown="if(event.key==='Enter')checkPw()" autofocus />
    <button class="login-btn" onclick="checkPw()">🔐 Είσοδος</button>
    <div class="login-error" id="loginError">❌ Λάθος κωδικός.</div>
  </div>
</div>

<!-- ADMIN -->
<div id="adminContent">
  <header class="header">
    <div>
      <div class="header-logo">STAMCAR</div>
      <div class="header-sub">Admin — Διαχείριση Αυτοκινήτων</div>
    </div>
    <div style="display:flex;align-items:center;gap:1rem;">
      <span class="db-status loading" id="dbStatus"><span class="spinner"></span> Σύνδεση...</span>
      <a href="index.html" class="back-link">← Site</a>
    </div>
  </header>

  <div class="layout">
    <!-- SIDEBAR FORM -->
    <aside class="sidebar">
      <div class="sidebar-title">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span id="formTitle">Νέο Αυτοκίνητο</span>
      </div>
      <input type="hidden" id="editId" value="" />

      <div class="form-row">
        <div class="form-group"><label>Μάρκα <span>*</span></label>
          <select id="fMake">
            <option value="">Επιλέξτε</option>
            <option>BMW</option><option>Mercedes-Benz</option><option>Audi</option><option>Volkswagen</option>
            <option>Toyota</option><option>Ford</option><option>Hyundai</option><option>Kia</option>
            <option>Nissan</option><option>Opel</option><option>Peugeot</option><option>Renault</option>
            <option>Skoda</option><option>Seat</option><option>Fiat</option><option>Honda</option>
            <option>Mazda</option><option>Volvo</option><option>Porsche</option><option>Land Rover</option>
          </select>
        </div>
        <div class="form-group"><label>Μοντέλο <span>*</span></label><input type="text" id="fModel" placeholder="π.χ. 320d M Sport" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Έτος <span>*</span></label><select id="fYear"></select></div>
        <div class="form-group"><label>Χιλιόμετρα <span>*</span></label><input type="number" id="fKm" placeholder="68000" min="0" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Καύσιμο <span>*</span></label>
          <select id="fFuel">
            <option value="">Επιλέξτε</option><option>Βενζίνη</option><option>Diesel</option>
            <option>Υβριδικό</option><option>Ηλεκτρικό</option><option>LPG/CNG</option>
          </select>
        </div>
        <div class="form-group"><label>Κιβώτιο <span>*</span></label>
          <select id="fGearbox"><option value="">Επιλέξτε</option><option>Αυτόματο</option><option>Χειροκίνητο</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Hp</label><input type="number" id="fHp" placeholder="190" min="0" /></div>
        <div class="form-group"><label>Τιμή (€) <span>*</span></label><input type="number" id="fPrice" placeholder="32900" min="0" /></div>
      </div>
      <div class="form-group"><label>Κατάσταση <span>*</span></label>
        <select id="fCondition"><option value="">Επιλέξτε</option><option>Άριστη</option><option>Καλή</option><option>Μέτρια</option><option>Κακή</option></select>
      </div>
      <div class="form-group"><label>Badge</label>
        <div class="badge-row">
          <div class="badge-opt selected" data-val="">Κανένα</div>
          <div class="badge-opt" data-val="hot">🔥 HOT</div>
          <div class="badge-opt" data-val="new">✨ ΝΕΟ</div>
        </div>
      </div>
      <div class="form-group"><label>Εξοπλισμός</label>
        <textarea id="fFeatures" rows="3" placeholder="LED φώτα&#10;Navigation&#10;Ηλιοροφή"></textarea>
        <p class="hints">Ένα χαρακτηριστικό ανά γραμμή</p>
      </div>
      <button class="btn btn-add" id="submitBtn" onclick="submitCar()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span id="submitText">Προσθήκη</span>
      </button>
      <button class="btn btn-clear" onclick="clearForm()">Καθαρισμός</button>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="stats-bar" id="statsBar"></div>
      <div class="table-header">
        <span class="table-title">Λίστα Αυτοκινήτων</span>
        <input type="text" class="search-input" id="tableSearch" placeholder="🔍 Αναζήτηση..." oninput="filterTable()" />
      </div>
      <table class="cars-table">
        <thead><tr>
          <th>#</th><th>Μάρκα / Μοντέλο</th><th>Έτος</th><th>Km</th>
          <th>Καύσιμο</th><th>Hp</th><th>Κατάσταση</th><th>Badge</th>
          <th>Τιμή</th><th>Ενέργειες</th>
        </tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty-state hidden" id="emptyState">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Δεν βρέθηκαν αυτοκίνητα
      </div>
    </main>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay hidden" id="editModal" onclick="if(event.target===this)closeEdit()">
  <div class="modal-box">
    <div class="modal-title">✏️ Επεξεργασία</div>
    <button class="modal-close" onclick="closeEdit()">✕</button>
    <div id="editFormInner"></div>
    <div style="display:flex;gap:.75rem;margin-top:1.25rem;">
      <button class="btn btn-add" style="flex:1;" onclick="saveEdit()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Ενημέρωση
      </button>
      <button class="btn btn-clear" style="width:auto;padding:.7rem 1.25rem;" onclick="closeEdit()">Ακύρωση</button>
    </div>
  </div>
</div>

<script>
/* ═════════════════════════════════════════════════════
   SUPABASE CONFIG
   ═════════════════════════════════════════════════════ */
const SB_URL = 'https://cdyhsmayzoqbtognfovj.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkeWhzbWF5em9xYnRvZ25mb3ZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTgyNTgsImV4cCI6MjA4Nzc5NDI1OH0.FzpLaM8VIsDqQFFVRnrHiuhFDD9jyL5hihidnj7DzQI';
const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

async function sbFetch(path, opts = {}) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, { headers: HEADERS, ...opts });
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  if (res.status === 204) return null;
  return res.json();
}

/* ═════════════════════════════════════════════════════
   PASSWORD
   ═════════════════════════════════════════════════════ */
const CORRECT = 'Stamcar2005';
let attempts  = 0;

function checkPw() {
  if (attempts >= 5) return;
  const val = document.getElementById('pwInput').value;
  const err = document.getElementById('loginError');
  if (val === CORRECT) {
    sessionStorage.setItem('stamcar_admin', '1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
    initAdmin();
  } else {
    attempts++;
    document.getElementById('pwInput').value = '';
    err.classList.remove('show');
    void err.offsetWidth;
    err.textContent = attempts >= 5 ? '🔒 Κλειδώθηκε. Ανανέωσε τη σελίδα.' : `❌ Λάθος κωδικός. (${5-attempts} απομένουν)`;
    err.classList.add('show');
  }
}

if (sessionStorage.getItem('stamcar_admin') === '1') {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminContent').style.display = 'block';
  document.addEventListener('DOMContentLoaded', initAdmin);
}
document.getElementById('pwInput').addEventListener('keydown', e => { if(e.key==='Enter') checkPw(); });

/* ═════════════════════════════════════════════════════
   INIT
   ═════════════════════════════════════════════════════ */
let ALL_CARS  = [];
let editingId = null;
let selBadge  = '';

async function initAdmin() {
  // Year options
  const ySel = document.getElementById('fYear');
  const yr = new Date().getFullYear();
  for (let i = yr; i >= 2000; i--) {
    const o = document.createElement('option'); o.value = i; o.textContent = i; ySel.appendChild(o);
  }
  // Badge selector
  document.querySelectorAll('.badge-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.badge-opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      selBadge = opt.dataset.val;
    });
  });
  await loadCars();
}

/* ═════════════════════════════════════════════════════
   LOAD
   ═════════════════════════════════════════════════════ */
async function loadCars() {
  setDbStatus('loading');
  try {
    ALL_CARS = await sbFetch('cars?select=*&order=id.asc');
    setDbStatus('ok');
    renderStats();
    renderTable();
  } catch(e) {
    setDbStatus('err');
    toast('❌ Σφάλμα σύνδεσης Supabase', 'error');
    console.error(e);
  }
}

function setDbStatus(s) {
  const el = document.getElementById('dbStatus');
  if (s === 'ok')      { el.className='db-status ok';      el.innerHTML='✅ Supabase Συνδεδεμένο'; }
  else if (s === 'err'){ el.className='db-status err';     el.innerHTML='❌ Σφάλμα σύνδεσης'; }
  else                 { el.className='db-status loading'; el.innerHTML='<span class="spinner"></span> Φόρτωση...'; }
}

/* ═════════════════════════════════════════════════════
   STATS
   ═════════════════════════════════════════════════════ */
function renderStats() {
  const total = ALL_CARS.length;
  const hot   = ALL_CARS.filter(c=>c.badge==='hot').length;
  const nw    = ALL_CARS.filter(c=>c.badge==='new').length;
  const avg   = total ? Math.round(ALL_CARS.reduce((s,c)=>s+c.price,0)/total) : 0;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-pill">Σύνολο: <span class="num">${total}</span></div>
    <div class="stat-pill">🔥 HOT: <span class="num">${hot}</span></div>
    <div class="stat-pill">✨ ΝΕΟ: <span class="num">${nw}</span></div>
    <div class="stat-pill">Μέση τιμή: <span class="num">${avg.toLocaleString('el-GR')} €</span></div>
  `;
}

/* ═════════════════════════════════════════════════════
   TABLE
   ═════════════════════════════════════════════════════ */
function renderTable(data) {
  const cars  = data || ALL_CARS;
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');
  if (!cars.length) { tbody.innerHTML=''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  tbody.innerHTML = cars.map(car => `
    <tr>
      <td class="td-dim">${car.id}</td>
      <td><div class="td-make">${car.make}</div><div class="td-model">${car.model}</div></td>
      <td class="td-dim">${car.year}</td>
      <td class="td-dim">${Number(car.km).toLocaleString('el-GR')}</td>
      <td class="td-dim">${car.fuel}</td>
      <td class="td-dim">${car.hp||'—'} hp</td>
      <td class="td-dim">${car.condition}</td>
      <td>${car.badge==='hot'?'<span class="badge-tag hot">HOT</span>':car.badge==='new'?'<span class="badge-tag new">ΝΕΟ</span>':'<span class="badge-tag none">—</span>'}</td>
      <td class="td-price">${Number(car.price).toLocaleString('el-GR')} €</td>
      <td>
        <button class="action-btn btn-edit" onclick="openEdit(${car.id})">✏️</button>
        <button class="action-btn btn-delete" onclick="deleteCar(${car.id},'${car.make} ${car.model}')">🗑️</button>
      </td>
    </tr>
  `).join('');
}

function filterTable() {
  const q = document.getElementById('tableSearch').value.toLowerCase().trim();
  if (!q) { renderTable(); return; }
  renderTable(ALL_CARS.filter(c =>
    c.make.toLowerCase().includes(q) || c.model.toLowerCase().includes(q) ||
    String(c.year).includes(q) || c.fuel.toLowerCase().includes(q)
  ));
}

/* ═════════════════════════════════════════════════════
   ADD
   ═════════════════════════════════════════════════════ */
async function submitCar() {
  const data = getFormData();
  if (!data) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('submitText').textContent = 'Αποθήκευση...';

  try {
    await sbFetch('cars', { method:'POST', body: JSON.stringify(data) });
    toast('✅ Το αυτοκίνητο προστέθηκε!', 'success');
    clearForm();
    await loadCars();
  } catch(e) {
    toast('❌ Σφάλμα αποθήκευσης: ' + e.message, 'error');
    console.error(e);
  } finally {
    btn.disabled = false;
    document.getElementById('submitText').textContent = 'Προσθήκη';
  }
}

/* ═════════════════════════════════════════════════════
   DELETE
   ═════════════════════════════════════════════════════ */
async function deleteCar(id, name) {
  if (!confirm(`Διαγραφή: ${name};\n\nΑυτή η ενέργεια δεν αναιρείται.`)) return;
  try {
    await sbFetch(`cars?id=eq.${id}`, { method: 'DELETE' });
    toast('🗑️ Διαγράφηκε!', 'success');
    await loadCars();
  } catch(e) {
    toast('❌ Σφάλμα διαγραφής', 'error');
    console.error(e);
  }
}

/* ═════════════════════════════════════════════════════
   EDIT
   ═════════════════════════════════════════════════════ */
function openEdit(id) {
  const car = ALL_CARS.find(c => c.id === id);
  if (!car) return;
  editingId = id;

  const makes = ['BMW','Mercedes-Benz','Audi','Volkswagen','Toyota','Ford','Hyundai','Kia','Nissan','Opel','Peugeot','Renault','Skoda','Seat','Fiat','Honda','Mazda','Volvo','Porsche','Land Rover'];
  const years = Array.from({length: new Date().getFullYear()-1999}, (_,i) => new Date().getFullYear()-i);
  const feats = Array.isArray(car.features) ? car.features.join('\n') : '';

  document.getElementById('editFormInner').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;">
      <div class="form-group"><label>Μάρκα *</label>
        <select id="eMake">${makes.map(m=>`<option ${m===car.make?'selected':''}>${m}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label>Μοντέλο *</label><input type="text" id="eModel" value="${car.model}" /></div>
      <div class="form-group"><label>Έτος *</label>
        <select id="eYear">${years.map(y=>`<option ${y===car.year?'selected':''}>${y}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label>Χιλιόμετρα *</label><input type="number" id="eKm" value="${car.km}" /></div>
      <div class="form-group"><label>Καύσιμο *</label>
        <select id="eFuel">${['Βενζίνη','Diesel','Υβριδικό','Ηλεκτρικό','LPG/CNG'].map(f=>`<option ${f===car.fuel?'selected':''}>${f}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label>Κιβώτιο *</label>
        <select id="eGearbox">${['Αυτόματο','Χειροκίνητο'].map(g=>`<option ${g===car.gearbox?'selected':''}>${g}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label>Hp</label><input type="number" id="eHp" value="${car.hp||''}" /></div>
      <div class="form-group"><label>Τιμή (€) *</label><input type="number" id="ePrice" value="${car.price}" /></div>
    </div>
    <div class="form-group"><label>Κατάσταση *</label>
      <select id="eCondition">${['Άριστη','Καλή','Μέτρια','Κακή'].map(c=>`<option ${c===car.condition?'selected':''}>${c}</option>`).join('')}</select>
    </div>
    <div class="form-group"><label>Badge</label>
      <select id="eBadge">
        <option value="" ${!car.badge?'selected':''}>Κανένα</option>
        <option value="hot" ${car.badge==='hot'?'selected':''}>🔥 HOT</option>
        <option value="new" ${car.badge==='new'?'selected':''}>✨ ΝΕΟ</option>
      </select>
    </div>
    <div class="form-group"><label>Εξοπλισμός</label>
      <textarea id="eFeatures" rows="3">${feats}</textarea>
      <p class="hints">Ένα χαρακτηριστικό ανά γραμμή</p>
    </div>
  `;

  document.getElementById('editModal').classList.remove('hidden');
}

async function saveEdit() {
  const data = {
    make:      document.getElementById('eMake').value,
    model:     document.getElementById('eModel').value.trim(),
    year:      parseInt(document.getElementById('eYear').value),
    km:        parseInt(document.getElementById('eKm').value),
    fuel:      document.getElementById('eFuel').value,
    gearbox:   document.getElementById('eGearbox').value,
    hp:        parseInt(document.getElementById('eHp').value) || 0,
    price:     parseInt(document.getElementById('ePrice').value),
    condition: document.getElementById('eCondition').value,
    badge:     document.getElementById('eBadge').value || null,
    features:  document.getElementById('eFeatures').value.split('\n').map(f=>f.trim()).filter(Boolean),
  };

  if (!data.make || !data.model || !data.year || isNaN(data.km) || !data.fuel || !data.gearbox || isNaN(data.price) || !data.condition) {
    toast('⚠️ Συμπληρώστε όλα τα υποχρεωτικά πεδία!', 'error'); return;
  }

  try {
    await sbFetch(`cars?id=eq.${editingId}`, { method: 'PATCH', body: JSON.stringify(data) });
    toast('✅ Ενημερώθηκε!', 'success');
    closeEdit();
    await loadCars();
  } catch(e) {
    toast('❌ Σφάλμα ενημέρωσης', 'error');
    console.error(e);
  }
}

function closeEdit() {
  document.getElementById('editModal').classList.add('hidden');
  editingId = null;
}

/* ═════════════════════════════════════════════════════
   FORM HELPERS
   ═════════════════════════════════════════════════════ */
function getFormData() {
  const make      = document.getElementById('fMake').value;
  const model     = document.getElementById('fModel').value.trim();
  const year      = parseInt(document.getElementById('fYear').value);
  const km        = parseInt(document.getElementById('fKm').value);
  const fuel      = document.getElementById('fFuel').value;
  const gearbox   = document.getElementById('fGearbox').value;
  const hp        = parseInt(document.getElementById('fHp').value) || 0;
  const price     = parseInt(document.getElementById('fPrice').value);
  const condition = document.getElementById('fCondition').value;
  const features  = document.getElementById('fFeatures').value.split('\n').map(f=>f.trim()).filter(Boolean);

  if (!make||!model||!year||isNaN(km)||!fuel||!gearbox||isNaN(price)||!condition) {
    toast('⚠️ Συμπληρώστε όλα τα υποχρεωτικά πεδία!', 'error');
    return null;
  }
  return { make, model, year, km, fuel, gearbox, hp, price, condition, badge: selBadge || null, features };
}

function clearForm() {
  ['fMake','fFuel','fGearbox','fCondition'].forEach(id => document.getElementById(id).value = '');
  ['fModel','fKm','fHp','fPrice','fFeatures'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fYear').selectedIndex = 0;
  document.querySelectorAll('.badge-opt').forEach(o => o.classList.remove('selected'));
  document.querySelector('.badge-opt[data-val=""]').classList.add('selected');
  selBadge = '';
  document.getElementById('formTitle').textContent = 'Νέο Αυτοκίνητο';
  document.getElementById('editId').value = '';
}

/* ═════════════════════════════════════════════════════
   TOAST
   ═════════════════════════════════════════════════════ */
function toast(msg, type='success') {
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 3000);
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeEdit(); });
</script>
</body>
</html>
